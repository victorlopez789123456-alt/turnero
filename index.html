<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Turnero TV • Supabase</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--purple:#7b2cff;--purple2:#a34cff;--ink:#241833;--muted:#756a83;--bg:#f5f2fb;--card:#fff;--line:#e4ddee;--ok:#1f9d69;--danger:#d63c4c;}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    button,input,select{font:inherit} button{cursor:pointer;border:0}.hidden{display:none!important}.muted{color:var(--muted)}
    .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand-badge{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;display:grid;place-items:center;font-weight:900}
    .nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{background:#f3eefb;color:var(--ink);padding:9px 12px;border-radius:10px}.nav button.active{background:var(--purple);color:#fff}
    .wrap{max-width:1500px;margin:0 auto;padding:22px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 26px rgba(47,24,70,.06);padding:18px}
    .grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    h1,h2,h3{margin:0 0 10px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-head p{margin:0}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field{margin-bottom:11px} input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none} input:focus,select:focus{border-color:var(--purple)}
    .btn{padding:11px 14px;border-radius:11px;font-weight:800;background:var(--purple);color:#fff}.btn.secondary{background:#f1eafa;color:var(--ink)}.btn.ok{background:var(--ok)}.btn.danger{background:var(--danger)}.btn.small{padding:8px 10px;font-size:13px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.stat{padding:16px;border-radius:15px;background:linear-gradient(180deg,#fff,#f8f4ff);border:1px solid var(--line)}.stat .n{font-size:30px;font-weight:900}.stat .l{font-size:12px;color:var(--muted)}
    table{width:100%;border-collapse:collapse}.table-wrap{overflow:auto} th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;white-space:nowrap;font-size:13px} th{font-size:12px;color:var(--muted)}
    .badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#f1eafa;font-size:12px;font-weight:800}.badge.ok{background:#e7f8f1;color:#11734c}
    .login{min-height:calc(100vh - 63px);display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%)}
    .tv-page{min-height:100vh;background:#fff;display:grid;grid-template-rows:auto 1fr auto}.tv-header{display:flex;justify-content:space-between;align-items:center;padding:22px 34px;border-bottom:6px solid var(--purple)}.tv-logo{font-size:32px;font-weight:1000;color:var(--purple);font-style:italic}.clock{font-size:26px;font-weight:900}.tv-main{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;padding:22px 34px}.called-card{border:3px solid var(--purple);border-radius:30px;padding:28px;display:flex;flex-direction:column;justify-content:center;min-height:430px}.label-big{font-size:28px;font-weight:800;color:var(--purple);margin-bottom:10px}.turn-big{font-size:clamp(70px,12vw,160px);font-weight:1000;line-height:1;color:var(--ink);letter-spacing:-4px}.module-big{font-size:clamp(44px,6vw,82px);font-weight:1000;margin-top:15px}.voice-note{margin-top:16px;font-size:15px;color:var(--muted)}.ad-frame{border-radius:30px;overflow:hidden;background:#141016;min-height:430px;display:grid;place-items:center;position:relative}.ad-frame img,.ad-frame video{width:100%;height:100%;max-height:520px;object-fit:cover}.ad-empty{color:#fff;text-align:center;padding:20px}.tv-footer{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;padding:14px 34px;font-size:20px;font-weight:800;text-align:center}.tv-history{padding:0 34px 24px}.history-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.history-item{border:2px solid #eadff6;border-radius:18px;padding:13px;text-align:center;background:#fff}.history-item .t{font-size:26px;font-weight:1000}.history-item .m{font-weight:900;color:var(--purple)}
    .advisor-call{min-height:calc(100vh - 63px);display:grid;place-items:center;padding:22px}.advisor-card{width:min(850px,100%)}.current{background:#1d1430;color:#fff;border-radius:22px;padding:24px;text-align:center}.current .t{font-size:88px;font-weight:1000}.current .m{font-size:44px;font-weight:1000}.two-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.two-buttons .btn{font-size:18px;padding:18px}
    .toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#1b1624;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.22);max-width:360px}.small-note{font-size:12px;color:var(--muted)}
    .preview-media{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.media-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.media-card img,.media-card video{display:block;width:100%;height:140px;object-fit:cover}.media-card .cap{padding:8px;font-size:12px}
    @media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.tv-main{grid-template-columns:1fr}.history-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:720px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.nav{display:none}.wrap{padding:14px}.tv-header,.tv-main,.tv-history{padding-left:14px;padding-right:14px}.history-grid{grid-template-columns:repeat(2,1fr)}.two-buttons{grid-template-columns:1fr}.called-card,.ad-frame{min-height:320px}.tv-logo{font-size:22px}.clock{font-size:18px}}
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL = 'https://enhcaykgpgxzsltgkujz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVuaGNheWtncGd4enNsdGdrdWp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTYwMDMsImV4cCI6MjEwMzMzMjAwM30.w6iWEAQoBJFBjJb08IKNuxG3zmI9IA1AMoWzfjKd6mA';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg){toastEl.textContent=msg;toastEl.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.add('hidden'),3600)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]))}
function fmtTurn(t){return `${esc(t.category_code)} ${esc(t.number)}`}
function sessionGet(kind){try{return JSON.parse(localStorage.getItem('turnero_'+kind)||'null')}catch{return null}}
function sessionSet(kind,val){localStorage.setItem('turnero_'+kind,JSON.stringify(val))}
function sessionClear(kind){localStorage.removeItem('turnero_'+kind)}
async function rpc(name,args={}){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}
function route(){const h=location.hash.replace('#',''); if(!h||h==='inicio'||h==='home'){renderHome();} else if(h.startsWith('admin')) renderAdmin(); else if(h.startsWith('asesor')) renderAdvisor(); else if(h.startsWith('kiosco')) renderKiosk(); else renderTv();}
window.addEventListener('hashchange',route);

function nav(active){return `<div class="topbar"><div class="brand"><div class="brand-badge">T</div>Turnero</div><div class="nav"><button class="${active==='home'?'active':''}" onclick="location.hash='inicio'">Inicio</button><button class="${active==='tv'?'active':''}" onclick="location.hash='tv'">Pantalla TV</button><button class="${active==='admin'?'active':''}" onclick="location.hash='admin'">Administración</button><button class="${active==='asesor'?'active':''}" onclick="location.hash='asesor'">Asesor / Módulo</button><button class="${active==='kiosco'?'active':''}" onclick="location.hash='kiosco'">Tomar turno</button></div></div>`}

function renderHome(){app.innerHTML=nav('home')+`<main class="wrap"><div class="panel" style="padding:28px;margin-bottom:18px"><div style="display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap"><div><div class="badge ok" style="margin-bottom:10px">Sistema de turnos</div><h1 style="font-size:34px">Bienvenido al Turnero</h1><p class="muted" style="font-size:16px;max-width:760px">Desde aquí puedes entrar a la pantalla del televisor, al panel de administración o a la consola del asesor. El administrador y los asesores se autentican contra Supabase.</p></div><button class="btn secondary" onclick="location.hash='kiosco'">Abrir toma de turnos</button></div></div><div class="grid grid-3"><section class="panel"><div style="font-size:34px">📺</div><h2>Pantalla TV</h2><p class="muted">Muestra el turno llamado, módulo, historial y publicidad.</p><button class="btn" style="width:100%" onclick="location.hash='tv'">Abrir pantalla</button></section><section class="panel"><div style="font-size:34px">🔐</div><h2>Administración</h2><p class="muted">Crea categorías, límites de turnos, asesores, módulos y publicidad.</p><button class="btn" style="width:100%" onclick="location.hash='admin'">Iniciar sesión admin</button><p class="small-note" style="margin-top:9px">Contraseña inicial del schema: 12</p></section><section class="panel"><div style="font-size:34px">🎧</div><h2>Asesor / Módulo</h2><p class="muted">Entra con módulo y contraseña de 4 dígitos asignados por el admin.</p><button class="btn" style="width:100%" onclick="location.hash='asesor'">Iniciar sesión asesor</button></section></div><div class="panel" style="margin-top:18px"><div class="section-head"><div><h3>Accesos directos</h3><p class="small-note">Puedes abrir estas rutas en pestañas distintas para montar el sistema.</p></div></div><div class="actions"><button class="btn secondary" onclick="location.hash='tv'">#tv · Televisor</button><button class="btn secondary" onclick="location.hash='admin'">#admin · Administración</button><button class="btn secondary" onclick="location.hash='asesor'">#asesor · Asesor</button><button class="btn secondary" onclick="location.hash='kiosco'">#kiosco · Toma turno</button></div></div></main>`}

function renderTv(){app.innerHTML=`<div class="tv-page"><div id="tvRoot"></div></div>`;loadTv();}
async function loadTv(){const root=document.getElementById('tvRoot');if(!root)return;root.innerHTML='<div class="tv-header"><div class="tv-logo">TU LOGO AQUÍ</div><div id="clock" class="clock"></div></div><div class="tv-main"><div><div class="called-card"><div class="label-big">Llamando:</div><div id="tvTurn" class="turn-big">—</div><div id="tvModule" class="module-big">Módulo —</div><div id="voiceNote" class="voice-note">La pantalla anunciará por voz cada nuevo turno.</div></div></div><div id="adFrame" class="ad-frame"><div class="ad-empty">Cargando publicidad…</div></div></div><div class="tv-history"><div class="section-head"><h3>Últimos turnos</h3><span class="small-note">Actualización automática</span></div><div id="history" class="history-grid"></div></div><div class="tv-footer">Bienvenidos • Por favor espere su turno</div>';
setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'})},500);await refreshTv(true);setInterval(()=>refreshTv(false),1800);}
let lastSpokenId=localStorage.getItem('turnero_last_spoken')||'';let mediaItems=[];let mediaIndex=0;let mediaTimer;
async function refreshTv(first){try{const data=await rpc('tv_snapshot',{});const cur=data?.current;const tvTurn=document.getElementById('tvTurn');const tvMod=document.getElementById('tvModule');if(!tvTurn)return;if(cur){tvTurn.textContent=`${cur.category_code} ${cur.number}`;tvMod.textContent=`Módulo ${cur.module_number}`;if(cur.id!==lastSpokenId){lastSpokenId=cur.id;localStorage.setItem('turnero_last_spoken',cur.id);if(!first)speakTurn(cur)}}else{tvTurn.textContent='—';tvMod.textContent='Módulo —'}
const h=document.getElementById('history');h.innerHTML=(data?.history||[]).map(t=>`<div class="history-item"><div class="t">${fmtTurn(t)}</div><div class="m">Módulo ${esc(t.module_number)}</div></div>`).join('');
if(JSON.stringify(mediaItems)!==JSON.stringify(data?.media||[])){mediaItems=data?.media||[];mediaIndex=0;renderMedia(true)}}catch(e){console.warn(e)}}
function speakTurn(cur){try{const u=new SpeechSynthesisUtterance(`Turno ${cur.category_code} ${cur.number}, módulo ${cur.module_number}`);u.lang='es-ES';u.rate=.9;u.pitch=1;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}catch{}}
function renderMedia(first=false){clearTimeout(mediaTimer);const box=document.getElementById('adFrame');if(!box)return;if(!mediaItems.length){box.innerHTML='<div class="ad-empty">Agrega imágenes o videos desde Administración.</div>';return}const item=mediaItems[mediaIndex%mediaItems.length];if(item.kind==='video'){box.innerHTML=`<video id="tvMedia" autoplay muted playsinline ${first?'':'controlsList="nodownload"'}></video>`;const v=document.getElementById('tvMedia');v.src=item.url;v.onended=()=>{mediaIndex=(mediaIndex+1)%mediaItems.length;renderMedia(false)};v.onerror=()=>{mediaIndex=(mediaIndex+1)%mediaItems.length;renderMedia(false)}}else{box.innerHTML=`<img alt="Publicidad" src="${esc(item.url)}">`;mediaTimer=setTimeout(()=>{mediaIndex=(mediaIndex+1)%mediaItems.length;renderMedia(false)},9000)}}

function renderAdmin(){const s=sessionGet('admin');if(!s){renderAdminLogin();return}app.innerHTML=nav('admin')+`<main class="wrap"><div class="section-head"><div><h1>Administración</h1><p class="muted">Configura turnos, categorías, asesores y publicidad.</p></div><button class="btn secondary" onclick="adminLogout()">Salir</button></div><div id="adminPanel"></div></main>`;loadAdmin();}
function renderAdminLogin(){app.innerHTML=nav('admin')+`<main class="login"><section class="panel login-card"><h2>Acceso de administración</h2><p class="muted">La contraseña se valida contra la base de datos.</p><form id="adminLogin"><div class="field"><label>Contraseña</label><input id="adminPass" type="password" autocomplete="current-password" placeholder="Contraseña" required></div><button class="btn" style="width:100%">Entrar</button></form><p class="small-note">La instalación inicial del esquema crea el administrador con contraseña 12.</p></section></main>`;document.getElementById('adminLogin').onsubmit=async e=>{e.preventDefault();try{const r=await rpc('login_admin',{p_password:document.getElementById('adminPass').value});sessionSet('admin',r);toast('Acceso correcto');renderAdmin()}catch(err){toast('Credenciales no válidas')}}}
function adminLogout(){sessionClear('admin');renderAdmin()}
async function loadAdmin(){const p=document.getElementById('adminPanel');p.innerHTML='<div class="panel">Cargando…</div>';try{const d=await rpc('admin_dashboard',{p_session:sessionGet('admin').token});p.innerHTML=`<div class="grid grid-4"><div class="stat"><div class="n">${d.counts.pending}</div><div class="l">Turnos pendientes</div></div><div class="stat"><div class="n">${d.counts.called}</div><div class="l">Turnos atendidos hoy</div></div><div class="stat"><div class="n">${d.counts.categories}</div><div class="l">Categorías</div></div><div class="stat"><div class="n">${d.counts.agents}</div><div class="l">Asesores</div></div></div><div style="height:14px"></div><div class="grid grid-2"><section class="panel"><div class="section-head"><h3>Categorías</h3></div><form id="catForm"><div class="grid grid-2"><div class="field"><label>Código</label><input id="catCode" maxlength="6" placeholder="A" required></div><div class="field"><label>Nombre</label><input id="catName" placeholder="Atención general" required></div><div class="field"><label>Límite de turnos</label><input id="catLimit" type="number" min="1" placeholder="Vacío = ilimitado"></div><div class="field"><label>&nbsp;</label><label style="font-weight:500"><input id="catUnlimited" type="checkbox" style="width:auto"> Sin límite</label></div></div><button class="btn small">Crear categoría</button></form><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Código</th><th>Nombre</th><th>Límite</th><th>Próximo</th><th></th></tr></thead><tbody>${(d.categories||[]).map(c=>`<tr><td><span class="badge">${esc(c.code)}</span></td><td>${esc(c.name)}</td><td>${c.max_turns??'Ilimitado'}</td><td>${c.next_number}</td><td><button class="btn secondary small" onclick="resetCategory('${c.id}')">Reiniciar</button></td></tr>`).join('')}</tbody></table></div></section>
<section class="panel"><div class="section-head"><h3>Asesores y módulos</h3></div><form id="agentForm"><div class="grid grid-2"><div class="field"><label>Nombre</label><input id="agName" required></div><div class="field"><label>Módulo</label><input id="agModule" required placeholder="1, 2, 3…"></div><div class="field"><label>Contraseña (4 dígitos)</label><input id="agPass" inputmode="numeric" maxlength="4" pattern="\\d{4}" required></div><div class="field"><label>Modo de atención</label><select id="agMode"><option value="random">Aleatoria (cualquier categoría)</option><option value="exclusive">Exclusiva</option></select></div><div class="field" id="exclusiveField"><label>Categoría exclusiva</label><select id="agCat"><option value="">Selecciona</option>${(d.categories||[]).map(c=>`<option value="${c.id}">${esc(c.code)} — ${esc(c.name)}</option>`).join('')}</select></div></div><button class="btn small">Crear asesor</button></form><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Asesor</th><th>Módulo</th><th>Modo</th><th>Categoría</th></tr></thead><tbody>${(d.agents||[]).map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.module_number)}</td><td>${esc(a.mode)}</td><td>${esc(a.category_code||'—')}</td></tr>`).join('')}</tbody></table></div></section></div>
<div style="height:14px"></div><section class="panel"><div class="section-head"><div><h3>Publicidad para la pantalla</h3><p class="small-note">Las imágenes y videos se muestran en el frame del televisor.</p></div></div><div class="grid grid-2"><div><form id="mediaForm"><div class="field"><label>Archivo</label><input id="mediaFile" type="file" accept="image/*,video/*" required></div><div class="field"><label>Nombre</label><input id="mediaTitle" placeholder="Campaña julio"></div><button class="btn">Subir publicidad</button></form><p class="small-note" style="margin-top:8px">El bucket de medios del esquema es público para poder reproducir la publicidad en la pantalla TV.</p></div><div><div class="preview-media">${(d.media||[]).map(m=>`<div class="media-card">${m.kind==='video'?`<video src="${esc(m.url)}" muted></video>`:`<img src="${esc(m.url)}" alt="">`}<div class="cap">${esc(m.title||'Sin título')} · ${esc(m.kind)}</div></div>`).join('')}</div></div></div></section>`;
 document.getElementById('catUnlimited').onchange=e=>document.getElementById('catLimit').disabled=e.target.checked;document.getElementById('catForm').onsubmit=createCategory;document.getElementById('agentForm').onsubmit=createAgent;document.getElementById('mediaForm').onsubmit=uploadMedia;document.getElementById('agMode').onchange=e=>document.getElementById('exclusiveField').style.display=e.target.value==='exclusive'?'block':'none';document.getElementById('agMode').dispatchEvent(new Event('change'));}catch(e){p.innerHTML='<div class="panel">No se pudo cargar la administración. Ejecuta primero el schema SQL.</div>'}}
async function createCategory(e){e.preventDefault();try{await rpc('admin_create_category',{p_session:sessionGet('admin').token,p_code:document.getElementById('catCode').value.trim().toUpperCase(),p_name:document.getElementById('catName').value.trim(),p_max_turns:document.getElementById('catUnlimited').checked?null:Number(document.getElementById('catLimit').value)||null});toast('Categoría creada');loadAdmin()}catch(err){toast(err.message||'No se pudo crear')}}
async function resetCategory(id){if(!confirm('¿Reiniciar el consecutivo de esta categoría?'))return;try{await rpc('admin_reset_category',{p_session:sessionGet('admin').token,p_category_id:id});toast('Consecutivo reiniciado');loadAdmin()}catch(e){toast(e.message||'No se pudo reiniciar')}}
async function createAgent(e){e.preventDefault();try{await rpc('admin_create_agent',{p_session:sessionGet('admin').token,p_name:document.getElementById('agName').value.trim(),p_module_number:document.getElementById('agModule').value.trim(),p_password:document.getElementById('agPass').value.trim(),p_mode:document.getElementById('agMode').value,p_category_id:document.getElementById('agCat').value||null});toast('Asesor creado');loadAdmin()}catch(err){toast(err.message||'No se pudo crear el asesor')}}
async function uploadMedia(e){e.preventDefault();const file=document.getElementById('mediaFile').files[0];if(!file)return;try{const token=crypto.randomUUID();const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${token}_${safe}`;const {error}=await sb.storage.from('turnero-media').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;const {data:{publicUrl}}=sb.storage.from('turnero-media').getPublicUrl(path);const kind=file.type.startsWith('video/')?'video':'image';await rpc('admin_add_media',{p_session:sessionGet('admin').token,p_title:document.getElementById('mediaTitle').value.trim()||file.name,p_kind:kind,p_url:publicUrl,p_path:path});toast('Publicidad subida');loadAdmin()}catch(err){toast(err.message||'No se pudo subir')}}


function renderKiosk(){
  app.innerHTML=nav('kiosco')+`<main class="wrap"><div class="section-head"><div><h1>Toma de turno</h1><p class="muted">Selecciona el servicio que necesitas.</p></div><button class="btn secondary" onclick="location.hash='tv'">Ver pantalla TV</button></div><section class="panel"><div id="kioskCats" class="grid grid-3"><div class="muted">Cargando categorías…</div></div></section></main>`;loadKiosk();
}
async function loadKiosk(){try{const d=await rpc('public_categories',{});const box=document.getElementById('kioskCats');box.innerHTML=(d||[]).map(c=>`<button class="panel" style="text-align:left;border:2px solid #eadff6" onclick="issuePublicTurn('${esc(c.code)}')"><div style="font-size:34px;font-weight:1000;color:var(--purple)">${esc(c.code)}</div><div style="font-weight:900">${esc(c.name)}</div><div class="small-note">Tocar para tomar turno</div></button>`).join('')||'<div class="muted">No hay categorías activas.</div>'}catch(e){document.getElementById('kioskCats').innerHTML='<div class="muted">No se pudieron cargar las categorías.</div>'}}
async function issuePublicTurn(code){try{const r=await rpc('issue_turn',{p_code:code});alert(`Tu turno es ${r.category_code} ${r.number}. Por favor espera a ser llamado.`)}catch(e){alert(e.message||'No fue posible generar el turno')}}

function renderAdvisor(){const s=sessionGet('advisor');if(!s){renderAdvisorLogin();return}app.innerHTML=nav('asesor')+`<main class="advisor-call"><section class="panel advisor-card"><div class="section-head"><div><h1>Módulo ${esc(s.module_number)}</h1><p class="muted">${esc(s.name)} · ${s.mode==='exclusive'?'Categoría exclusiva':'Atención aleatoria'}</p></div><button class="btn secondary" onclick="advisorLogout()">Salir</button></div><div class="current"><div>Último llamado</div><div id="advisorCurrent" class="t">—</div><div id="advisorCurrentM" class="m">Módulo ${esc(s.module_number)}</div></div><div class="two-buttons"><button class="btn ok" onclick="callNext(true)">Llamar siguiente de mi categoría</button><button class="btn" onclick="callNext(false)">Llamar siguiente de cualquier categoría</button></div><p class="small-note" style="margin-top:12px">El turno se reserva de forma segura en Supabase para evitar que dos módulos llamen el mismo turno.</p><div id="advisorMsg" class="small-note"></div></section></main>`;pollAdvisor();setInterval(pollAdvisor,1800)}
function renderAdvisorLogin(){app.innerHTML=nav('asesor')+`<main class="login"><section class="panel login-card"><h2>Acceso asesor / módulo</h2><p class="muted">Usa el número de módulo y la contraseña de 4 dígitos creada por el administrador.</p><form id="advisorLogin"><div class="field"><label>Módulo</label><input id="advMod" inputmode="text" required></div><div class="field"><label>Contraseña</label><input id="advPass" type="password" inputmode="numeric" maxlength="4" pattern="\\d{4}" required></div><button class="btn" style="width:100%">Entrar</button></form></section></main>`;document.getElementById('advisorLogin').onsubmit=async e=>{e.preventDefault();try{const r=await rpc('login_agent',{p_module_number:document.getElementById('advMod').value.trim(),p_password:document.getElementById('advPass').value.trim()});sessionSet('advisor',r);toast('Acceso correcto');renderAdvisor()}catch(err){toast('Módulo o contraseña no válidos')}}}
function advisorLogout(){sessionClear('advisor');renderAdvisor()}
async function pollAdvisor(){const s=sessionGet('advisor');if(!s)return;try{const r=await rpc('agent_last_called',{p_session:s.token});document.getElementById('advisorCurrent').textContent=r?`${r.category_code} ${r.number}`:'—';document.getElementById('advisorCurrentM').textContent=`Módulo ${s.module_number}`;document.getElementById('advisorMsg').textContent=r?`Turno llamado a las ${new Date(r.called_at).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}`:''}catch(e){}}
async function callNext(preferOwn){try{const s=sessionGet('advisor');const r=await rpc('agent_call_next',{p_session:s.token,p_prefer_own_category:preferOwn});if(!r){toast('No hay turnos pendientes');return}toast(`Llamando ${r.category_code} ${r.number} al módulo ${r.module_number}`);document.getElementById('advisorCurrent').textContent=`${r.category_code} ${r.number}`; }catch(e){toast(e.message||'No fue posible llamar el turno')}}

route();
</script>
</body>
</html>
